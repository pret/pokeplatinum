name: build

on:
  push:
    branches: [ pc_port ]
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

env:
  LM_LICENSE_FILE: "${{ github.workspace }}/tools/cw/license.dat"
  BUILD: /var/tmp/pokeplatinum

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - name: Install Software
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends docker git python3 wget

      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Install Metroskrew
        run: ./drun.sh make skrew

      - name: Build (ARM)
        run: ./drun.sh make

      - name: Build (Linux)
        run: ./drun.sh make linux
